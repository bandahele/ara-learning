<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>✨ English Learning Portal ✨</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pastelPink: '#ff8ab3',
                        pastelPurple: '#b388ff',
                        pastelCyan: '#4dd0e1',
                        textMain: '#3d2a5c',
                        textMuted: '#7a6a8f'
                    },
                    fontFamily: {
                        sans: ['Nunito', 'Quicksand', 'sans-serif'],
                        title: ['Quicksand', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background: linear-gradient(135deg, #fce4ec 0%, #f3e5f5 45%, #e8ddff 100%);
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 30px rgba(179, 136, 255, 0.18);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen px-4 py-8 font-sans text-textMain">

<div class="w-full max-w-md flex flex-col gap-5 relative z-10">

    <!-- HEADER -->
    <header class="text-center">
        <div class="inline-flex items-center gap-1.5 bg-white/80 border border-white/90 backdrop-blur-md px-4 py-1.5 rounded-full text-xs font-extrabold text-pastelPurple shadow-sm mb-2">
            <span>📚</span>
            <span>English Wonderland</span>
            <span>✨</span>
        </div>
        <h1 class="font-title text-3xl font-extrabold bg-gradient-to-r from-purple-600 to-pink-500 bg-clip-text text-transparent">
            Pilih Modul Bahasa Inggris ✨
        </h1>
        <p class="text-xs font-bold text-textMuted mt-1">
            Pilih materi kuis yang ingin dimainkan! 🚀
        </p>
    </header>

    <!-- DAFTAR KUIS -->
    <main class="flex flex-col gap-3.5">

        <!-- MODUL 1: ENGLISH QUIZ -->
        <a href="English_Quiz.html" class="glass-card rounded-3xl p-4 flex items-center text-decoration-none transition-all duration-300 hover:-translate-y-1 hover:shadow-xl active:scale-95 group">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-pink-100 to-purple-100 border border-pink-200 flex items-center justify-center text-3xl mr-3.5 shrink-0 group-hover:scale-110 transition-transform">
                🔤
            </div>
            <div class="flex-1">
                <span class="inline-block text-[10px] font-extrabold tracking-wider uppercase px-2.5 py-0.5 rounded-lg bg-pink-100 text-pink-600 mb-1">
                    Modul 1
                </span>
                <h2 class="text-base font-extrabold text-textMain leading-snug">
                    English Quiz
                </h2>
                <p class="text-xs font-bold text-textMuted mt-0.5">
                    Latihan Kosakata & Tata Bahasa
                </p>
            </div>
            <div class="w-9 h-9 rounded-full bg-white flex items-center justify-center text-pastelPurple font-black text-sm shadow-sm group-hover:bg-pastelPurple group-hover:text-white transition-all">
                ➔
            </div>
        </a>

        <!-- MODUL 2: MOVIE QUIZ -->
        <a href="Movie_Quiz.html" class="glass-card rounded-3xl p-4 flex items-center text-decoration-none transition-all duration-300 hover:-translate-y-1 hover:shadow-xl active:scale-95 group">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-cyan-100 to-indigo-100 border border-cyan-200 flex items-center justify-center text-3xl mr-3.5 shrink-0 group-hover:scale-110 transition-transform">
                🎬
            </div>
            <div class="flex-1">
                <span class="inline-block text-[10px] font-extrabold tracking-wider uppercase px-2.5 py-0.5 rounded-lg bg-cyan-100 text-teal-700 mb-1">
                    Modul 2
                </span>
                <h2 class="text-base font-extrabold text-textMain leading-snug">
                    Movie Quiz
                </h2>
                <p class="text-xs font-bold text-textMuted mt-0.5">
                    Kuis Film & Pemahaman Kalimat
                </p>
            </div>
            <div class="w-9 h-9 rounded-full bg-white flex items-center justify-center text-pastelPurple font-black text-sm shadow-sm group-hover:bg-pastelCyan group-hover:text-white transition-all">
                ➔
            </div>
        </a>

    </main>

</div>

</body>
</html>
