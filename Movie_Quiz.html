<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎬 Movie Quiz Wonderland</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&family=Quicksand:wght@700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandPurple: '#7c3aed',
                        brandPink: '#ec4899',
                        brandCyan: '#06b6d4',
                        textMain: '#1e1b4b',
                        textMuted: '#64748b'
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Quicksand', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background: radial-gradient(circle at top left, #fbcfe8, #e0e7ff, #f3e8ff);
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }
        .premium-card {
            background: rgba(255, 255, 255, 0.88);
            border: 1.5px solid rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px -15px rgba(124, 58, 237, 0.15);
        }
        iframe, video { pointer-events: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-3 sm:p-5 font-sans text-textMain" oncontextmenu="return false;">

<div class="w-full max-w-md premium-card rounded-3xl p-5 sm:p-6 shadow-2xl relative z-10 flex flex-col gap-4">

    <!-- HEADER -->
    <header class="text-center">
        <div class="inline-flex items-center gap-1.5 bg-white/90 border border-purple-100 px-3.5 py-1 rounded-full text-[11px] font-black text-brandPurple shadow-sm mb-1.5">
            <span class="animate-pulse">✨</span>
            <span>Movie Learning Cinema</span>
            <span>🎬</span>
        </div>
        <h1 class="text-2xl font-black bg-gradient-to-r from-violet-600 via-purple-600 to-pink-500 bg-clip-text text-transparent tracking-tight">
            Movie Quiz
        </h1>
        <p class="text-[11px] font-bold text-textMuted mt-0.5">
            Pilih dan tonton seluruh film pada sesi pilihan Anda! 🚀
        </p>
    </header>

    <!-- HALAMAN UTAMA: DAFTAR SESI KUIS -->
    <section id="list-sesi-section" class="flex flex-col gap-3">
        <div id="loading-sesi" class="text-center py-10 text-xs font-bold text-textMuted flex flex-col items-center gap-2">
            <span class="animate-spin text-3xl text-brandPurple">🌀</span>
            <span>Memeriksa daftar sesi dari Google Sheets...</span>
        </div>
        <div id="container-sesi-list" class="flex flex-col gap-2.5 hidden">
            <!-- Daftar Sesi disuntikkan secara dinamis -->
        </div>
    </section>

    <!-- PEMUTAR VIDEO & DAFTAR IKON FILM -->
    <section id="player-section" class="hidden flex-col gap-3.5">
        
        <!-- JUDUL SESI & PROGRES TOTAL -->
        <div class="flex items-center justify-between gap-2 bg-white/70 p-2.5 rounded-2xl border border-white shadow-sm">
            <div id="label-sesi-aktif" class="text-xs font-black text-brandPurple uppercase tracking-wider">
                Sesi
            </div>
            <div id="label-progres-total" class="text-[10px] font-black bg-purple-100 text-brandPurple px-2.5 py-1 rounded-xl">
                0 / 0 Film Selesai
            </div>
        </div>

        <!-- DAFTAR IKON FILM PER SESI -->
        <div class="flex flex-col gap-1.5">
            <span class="text-[11px] font-extrabold text-textMuted px-1">Pilih Film:</span>
            <div id="container-film-list" class="flex gap-2 overflow-x-auto pb-1.5 scrollbar-none">
                <!-- Ikon film disuntikkan dinamis -->
            </div>
        </div>

        <!-- CONTAINER LAYAR VIDEO -->
        <div id="video-container" class="relative w-full aspect-video bg-black rounded-2xl overflow-hidden shadow-2xl ring-4 ring-white/50 flex items-center justify-center">
            <!-- Video/Iframe disuntikkan dinamis -->
        </div>

        <!-- STATUS NONTON & JUDUL FILM AKTIF -->
        <div id="status-nonton-container" class="flex items-center justify-between text-[11px] font-extrabold px-1 text-textMuted">
            <span id="judul-film-aktif" class="text-xs font-extrabold text-textMain truncate max-w-[180px]">
                Judul Film
            </span>
            <span id="label-waktu">⏳ 00:00</span>
        </div>

        <!-- KONTROL PEMUTAR TERBATAS -->
        <div class="grid grid-cols-3 gap-2">
            <button onclick="rewindVideo(5)" class="py-2.5 bg-white/90 hover:bg-white text-textMain border border-purple-100 font-extrabold text-xs rounded-xl shadow-sm active:scale-95 transition-all flex items-center justify-center gap-1">
                ⏪ -5s
            </button>
            <button onclick="togglePlay()" id="btn-play" class="py-2.5 bg-gradient-to-r from-violet-600 to-purple-600 text-white font-extrabold text-xs rounded-xl shadow-md active:scale-95 transition-all flex items-center justify-center gap-1">
                ▶️ Play
            </button>
            <button onclick="toggleFullscreen()" class="py-2.5 bg-white/90 hover:bg-white text-textMain border border-purple-100 font-extrabold text-xs rounded-xl shadow-sm active:scale-95 transition-all flex items-center justify-center gap-1">
                📺 Full
            </button>
        </div>

        <!-- TOMBOL SELESAI PER FILM -->
        <button id="btn-selesai" onclick="tandaiFilmSelesai()" disabled class="w-full py-3.5 bg-gray-200 text-gray-400 font-black text-xs rounded-2xl shadow-none cursor-not-allowed transition-all flex items-center justify-center gap-1.5">
            <span>🔒 Nonton Hingga Selesai</span>
        </button>

        <!-- TOMBOL SUBMIT LAPORAN -->
        <button id="btn-submit" onclick="submitHasil()" class="hidden w-full py-3.5 bg-gradient-to-r from-pink-500 to-rose-500 text-white font-black text-xs rounded-2xl shadow-lg active:scale-95 transition-all">
            Kirim Laporan Sesi 🎉
        </button>

        <button onclick="kembaliKeDaftar()" class="w-full py-2 bg-white/50 hover:bg-white/80 text-textMuted font-extrabold text-[11px] rounded-xl transition-all border border-white/60">
            ⬅️ Kembali ke Daftar Sesi
        </button>
    </section>

</div>

<!-- YOUTUBE API IFRAME SDK -->
<script src="https://www.youtube.com/iframe_api"></script>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyl7-224Bnau2pPp0FpJBOB2CNOKSr0r9XxQ_fjYwl2KwCDREiTGDys44062D0VFgTP/exec";

    let daftarSesiTersedia = [];
    let completedSesiFromSheets = [];
    let sesiAktif = "";
    let playlistSesi = [];
    let indexAktif = 0;
    let filmSelesaiSet = new Set();
    
    let ytPlayerInstance = null;
    let isPlaying = false;
    let checkProgressTimer = null;
    let isVideoEnded = false;

    document.addEventListener("DOMContentLoaded", () => {
        muatDaftarSesi();
    });

    async function muatDaftarSesi() {
        const loadingEl = document.getElementById('loading-sesi');
        const containerEl = document.getElementById('container-sesi-list');
        loadingEl.classList.remove('hidden');
        containerEl.classList.add('hidden');

        try {
            const res = await fetch(`${WEB_APP_URL}?action=getSessions`);
            const responseData = await res.json();

            if (responseData && typeof responseData === 'object') {
                if (Array.isArray(responseData.sessions)) {
                    daftarSesiTersedia = responseData.sessions;
                }
                if (Array.isArray(responseData.completedSessions)) {
                    completedSesiFromSheets = responseData.completedSessions;
                }
            } else if (Array.isArray(responseData)) {
                daftarSesiTersedia = responseData;
            }
        } catch (e) {
            console.log("Gagal memuat sesi dari Google Sheets.");
        }

        loadingEl.classList.add('hidden');
        containerEl.innerHTML = '';
        containerEl.classList.remove('hidden');

        if (daftarSesiTersedia.length === 0) {
            containerEl.innerHTML = `<div class="text-center py-6 text-xs font-bold text-textMuted">Tidak ada sesi yang ditemukan di Google Sheets.</div>`;
            return;
        }

        daftarSesiTersedia.forEach((sesi, idx) => {
            const isDone = completedSesiFromSheets.includes(sesi);
            
            const card = document.createElement('div');
            card.className = `p-3.5 rounded-2xl bg-white/80 border ${isDone ? 'border-emerald-200 bg-emerald-50/40' : 'border-purple-100'} flex items-center justify-between shadow-sm hover:shadow-md active:scale-98 transition-all cursor-pointer`;
            card.onclick = () => pilihSesi(sesi);

            card.innerHTML = `
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-xl ${isDone ? 'bg-emerald-500 text-white' : 'bg-purple-100 text-brandPurple'} flex items-center justify-center font-black text-xs shadow-sm">
                        ${isDone ? '✓' : (idx + 1)}
                    </div>
                    <div>
                        <div class="font-extrabold text-xs text-textMain">${sesi}</div>
                        <div class="text-[10px] font-bold ${isDone ? 'text-emerald-600' : 'text-textMuted'}">
                            ${isDone ? 'Selesai Dikembangkan ✅' : 'Siap Diputar 🎬'}
                        </div>
                    </div>
                </div>
                <div class="text-[11px] font-black px-3 py-1.5 rounded-xl ${isDone ? 'bg-emerald-100 text-emerald-700' : 'bg-gradient-to-r from-violet-600 to-purple-600 text-white shadow-sm'}">
                    ${isDone ? 'Putar Ulang' : 'Mulai ▶'}
                </div>
            `;
            containerEl.appendChild(card);
        });
    }

    async function pilihSesi(sesi) {
        sesiAktif = sesi;
        const containerEl = document.getElementById('container-sesi-list');
        containerEl.innerHTML = `
            <div class="text-center py-8 text-xs font-bold text-textMuted flex flex-col items-center gap-2">
                <span class="animate-spin text-2xl text-brandPurple">🌀</span>
                <span>Memuat video untuk ${sesi}...</span>
            </div>
        `;

        try {
            const res = await fetch(`${WEB_APP_URL}?sesi=${encodeURIComponent(sesi)}`);
            const data = await res.json();

            if (data.status === "error" || !Array.isArray(data) || data.length === 0) {
                alert(`Data film untuk "${sesi}" tidak ditemukan atau masih kosong.`);
                muatDaftarSesi();
                return;
            }

            playlistSesi = data;
            indexAktif = 0;
            filmSelesaiSet.clear();

            document.getElementById('list-sesi-section').classList.add('hidden');
            document.getElementById('player-section').classList.remove('hidden');
            document.getElementById('player-section').classList.add('flex');
            document.getElementById('label-sesi-aktif').innerText = sesi;
            
            renderDaftarIkonFilm();
            muatFilm(0);
        } catch (e) {
            alert("Gagal terhubung ke Google Sheets.");
            muatDaftarSesi();
        }
    }

    function renderDaftarIkonFilm() {
        const container = document.getElementById('container-film-list');
        container.innerHTML = '';

        playlistSesi.forEach((item, idx) => {
            const isCurrent = idx === indexAktif;
            const isDone = filmSelesaiSet.has(idx);

            const btn = document.createElement('button');
            btn.onclick = () => gantiFilm(idx);
            btn.className = `flex-shrink-0 px-3 py-2 rounded-xl text-left border flex flex-col gap-0.5 transition-all ${
                isCurrent 
                    ? 'bg-gradient-to-r from-violet-600 to-purple-600 text-white border-purple-600 shadow-md scale-105' 
                    : isDone 
                        ? 'bg-emerald-100/80 text-emerald-800 border-emerald-300' 
                        : 'bg-white/80 text-textMain border-purple-100 hover:bg-white'
            }`;

            btn.innerHTML = `
                <div class="flex items-center gap-1 text-[10px] font-black">
                    <span>🎬 Film ${idx + 1}</span>
                    <span class="ml-auto">${isDone ? '✅' : isCurrent ? '▶' : '🔒'}</span>
                </div>
                <div class="text-[11px] font-extrabold truncate max-w-[100px] ${isCurrent ? 'text-white' : 'text-textMain'}">
                    ${item.judul || 'Film ' + (idx + 1)}
                </div>
            `;

            container.appendChild(btn);
        });

        document.getElementById('label-progres-total').innerText = `${filmSelesaiSet.size} / ${playlistSesi.length} Film Selesai`;
    }

    function gantiFilm(idx) {
        if (indexAktif === idx) return;
        indexAktif = idx;
        renderDaftarIkonFilm();
        muatFilm(idx);
    }

    function muatFilm(idx) {
        resetTimer();
        const item = playlistSesi[idx];
        document.getElementById('judul-film-aktif').innerText = item.judul || `Film #${item.noFilm}`;
        
        const container = document.getElementById('video-container');
        container.innerHTML = '';
        
        if (filmSelesaiSet.has(idx)) {
            bukaTombolSelesai();
        } else {
            kunciTombolSelesai();
        }

        const url = item.url || '';

        if (url.includes('youtube.com') || url.includes('youtu.be')) {
            let videoId = url.includes('v=') ? url.split('v=')[1].split('&')[0] : url.split('/').pop().split('?')[0];
            
            const ytDiv = document.createElement('div');
            ytDiv.id = 'yt-embed-player';
            ytDiv.className = 'w-full h-full pointer-events-none';
            container.appendChild(ytDiv);

            ytPlayerInstance = new YT.Player('yt-embed-player', {
                videoId: videoId,
                playerVars: { 'controls': 0, 'rel': 0, 'disablekb': 1, 'modestbranding': 1 },
                events: {
                    'onStateChange': onYouTubeStateChange
                }
            });
        } else {
            ytPlayerInstance = null;
            const vPlayer = document.createElement('video');
            vPlayer.id = 'direct-player';
            vPlayer.className = 'w-full h-full object-contain pointer-events-none';
            vPlayer.src = url;
            vPlayer.onended = function() {
                bukaTombolSelesai();
            };
            container.appendChild(vPlayer);
        }

        checkProgressTimer = setInterval(pantauProgresWaktu, 500);
    }

    function onYouTubeStateChange(event) {
        if (event.data === YT.PlayerState.ENDED) {
            bukaTombolSelesai();
        }
    }

    function pantauProgresWaktu() {
        let currentTime = 0;
        let duration = 0;

        if (ytPlayerInstance && ytPlayerInstance.getCurrentTime) {
            currentTime = ytPlayerInstance.getCurrentTime() || 0;
            duration = ytPlayerInstance.getDuration() || 0;
        } else {
            const directPlayer = document.getElementById('direct-player');
            if (directPlayer) {
                currentTime = directPlayer.currentTime || 0;
                duration = directPlayer.duration || 0;
            }
        }

        if (duration > 0) {
            const formatTime = (s) => new Date(s * 1000).toISOString().substr(14, 5);
            document.getElementById('label-waktu').innerText = `⏳ ${formatTime(currentTime)} / ${formatTime(duration)}`;
            
            if (duration - currentTime <= 2 && !isVideoEnded) {
                bukaTombolSelesai();
            }
        }
    }

    function bukaTombolSelesai() {
        isVideoEnded = true;
        const btnSelesai = document.getElementById('btn-selesai');
        btnSelesai.disabled = false;
        btnSelesai.className = "w-full py-3.5 bg-gradient-to-r from-emerald-500 to-teal-500 text-white font-black text-xs rounded-2xl shadow-lg active:scale-95 transition-all flex items-center justify-center gap-1.5 cursor-pointer";
        btnSelesai.innerHTML = "<span>Selesai Nonton Film Ini ✅</span>";
    }

    function kunciTombolSelesai() {
        isVideoEnded = false;
        const btnSelesai = document.getElementById('btn-selesai');
        btnSelesai.disabled = true;
        btnSelesai.className = "w-full py-3.5 bg-gray-200 text-gray-400 font-black text-xs rounded-2xl shadow-none cursor-not-allowed transition-all flex items-center justify-center gap-1.5";
        btnSelesai.innerHTML = "<span>🔒 Nonton Hingga Selesai</span>";
    }

    function togglePlay() {
        const btnPlay = document.getElementById('btn-play');

        if (ytPlayerInstance && ytPlayerInstance.playVideo) {
            if (isPlaying) {
                ytPlayerInstance.pauseVideo();
                btnPlay.innerText = "▶️ Play";
            } else {
                ytPlayerInstance.playVideo();
                btnPlay.innerText = "⏸️ Pause";
            }
        } else {
            const directPlayer = document.getElementById('direct-player');
            if (directPlayer) {
                if (isPlaying) {
                    directPlayer.pause();
                    btnPlay.innerText = "▶️ Play";
                } else {
                    directPlayer.play();
                    btnPlay.innerText = "⏸️ Pause";
                }
            }
        }
        isPlaying = !isPlaying;
    }

    function rewindVideo(seconds) {
        if (ytPlayerInstance && ytPlayerInstance.getCurrentTime) {
            const curr = ytPlayerInstance.getCurrentTime();
            ytPlayerInstance.seekTo(Math.max(0, curr - seconds), true);
        } else {
            const directPlayer = document.getElementById('direct-player');
            if (directPlayer) {
                directPlayer.currentTime = Math.max(0, directPlayer.currentTime - seconds);
            }
        }
    }

    function toggleFullscreen() {
        const container = document.getElementById('video-container');
        if (!document.fullscreenElement) {
            if (container.requestFullscreen) {
                container.requestFullscreen();
            } else if (container.webkitRequestFullscreen) {
                container.webkitRequestFullscreen();
            }
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    }

    function tandaiFilmSelesai() {
        if (!isVideoEnded) return;

        filmSelesaiSet.add(indexAktif);
        renderDaftarIkonFilm();

        if (filmSelesaiSet.size === playlistSesi.length) {
            document.getElementById('btn-selesai').classList.add('hidden');
            document.getElementById('btn-submit').classList.remove('hidden');
            alert("Seluruh film di sesi ini telah berhasil ditonton! Klik 'Kirim Laporan Sesi'.");
        } else {
            alert(`Film ${indexAktif + 1} selesai! Silakan pilih film berikutnya.`);
        }
    }

    async function submitHasil() {
        const btnSubmit = document.getElementById('btn-submit');
        btnSubmit.innerText = "Mengirim Laporan...";
        btnSubmit.disabled = true;

        const payload = {
            namaSiswa: "Siswa",
            sesi: sesiAktif,
            totalFilm: playlistSesi.length
        };

        try {
            await fetch(WEB_APP_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });
            
            alert("Laporan sesi berhasil dikirim!");
            kembaliKeDaftar();
        } catch (e) {
            alert("Gagal mengirim laporan ke sistem.");
            btnSubmit.innerText = "Kirim Laporan Sesi 🎉";
            btnSubmit.disabled = false;
        }
    }

    function resetTimer() {
        if (checkProgressTimer) {
            clearInterval(checkProgressTimer);
            checkProgressTimer = null;
        }
    }

    function kembaliKeDaftar() {
        resetTimer();
        document.getElementById('player-section').classList.add('hidden');
        document.getElementById('player-section').classList.remove('flex');
        document.getElementById('list-sesi-section').classList.remove('hidden');
        document.getElementById('btn-submit').classList.add('hidden');
        document.getElementById('video-container').innerHTML = '';
        muatDaftarSesi();
    }
</script>

</body>
</html>
