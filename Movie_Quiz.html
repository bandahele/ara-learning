<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎬 Movie Quiz Cinema</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandPurple: '#7c3aed',
                        brandPink: '#ec4899',
                        textMain: '#1e1b4b',
                        textMuted: '#64748b'
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }
        #video-container, #video-container * {
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-2 sm:p-4 font-sans" oncontextmenu="return false;">

<!-- WADAH UTAMA -->
<div class="w-full max-w-5xl bg-slate-900 border border-slate-800 rounded-2xl p-3 shadow-2xl relative flex flex-col gap-3">

    <!-- HALAMAN UTAMA: DAFTAR SESI -->
    <section id="list-sesi-section" class="flex flex-col gap-3 p-4">
        <header class="text-center">
            <h1 class="text-xl font-black text-purple-400">🎬 Movie Quiz Cinema 21</h1>
            <p class="text-xs font-bold text-slate-400">Pilih sesi untuk memulai pembelajaran!</p>
        </header>
        
        <div id="loading-sesi" class="text-center py-8 text-xs font-bold text-slate-400 flex flex-col items-center gap-2">
            <span class="animate-spin text-2xl text-purple-500">🌀</span>
            <span>Memuat status sesi dari Google Sheets...</span>
        </div>
        <div id="container-sesi-list" class="grid grid-cols-2 sm:grid-cols-3 gap-2.5 hidden">
            <!-- Sesi disuntikkan dinamis -->
        </div>
    </section>

    <!-- TAMPILAN RESPANSIF ADAPTIF -->
    <section id="player-section" class="hidden grid grid-cols-1 landscape:grid-cols-12 gap-3 h-full items-center">
        
        <!-- PEMUTAR VIDEO -->
        <div class="landscape:col-span-8 flex flex-col gap-2 w-full">
            <div id="video-container" class="relative w-full aspect-video bg-black rounded-xl overflow-hidden shadow-2xl border border-slate-800 flex items-center justify-center">
                <!-- Video disuntikkan di sini -->
            </div>
            
            <!-- STATUS WAKTU & JUDUL -->
            <div class="flex items-center justify-between text-[11px] font-extrabold px-1 text-slate-400">
                <span id="judul-film-aktif" class="truncate max-w-[200px] text-slate-200">Judul Film</span>
                <span id="label-waktu" class="text-purple-400">⏳ 00:00</span>
            </div>

            <!-- INFO TIMER REAL (WAKTU NONTON AKTUAL) -->
            <div class="flex items-center justify-between text-[10px] font-extrabold px-1">
                <span class="text-slate-500">⏱️ Durasi Tonton (Real):</span>
                <span id="label-timer-real" class="text-emerald-400 bg-emerald-950/40 px-2 py-0.5 rounded border border-emerald-800/50">00:00</span>
            </div>
        </div>

        <!-- BILAH KONTROL -->
        <div class="landscape:col-span-4 flex flex-col justify-between gap-2.5 h-full bg-slate-950 p-3 rounded-xl border border-slate-800 w-full">
            
            <!-- HEADER SESI -->
            <div class="flex justify-between items-center pb-2 border-b border-slate-800">
                <span id="label-sesi-aktif" class="text-xs font-black text-purple-400">Sesi 1</span>
                <span id="label-progres-total" class="text-[10px] font-bold bg-slate-800 text-slate-300 px-2 py-0.5 rounded">0/0 Film</span>
            </div>

            <!-- IKON LIST FILM -->
            <div class="flex flex-col gap-1">
                <span class="text-[10px] font-extrabold text-slate-500">DAFTAR FILM:</span>
                <div id="container-film-list" class="flex flex-col gap-1.5 max-h-28 overflow-y-auto pr-1">
                    <!-- Tombol pilihan film -->
                </div>
            </div>

            <!-- NAVIGASI PEMUTAR -->
            <div class="grid grid-cols-2 gap-2">
                <button onclick="rewindVideo(5)" class="py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 font-extrabold text-xs rounded-lg active:scale-95 transition-all">
                    ⏪ -5s
                </button>
                <button onclick="togglePlay()" id="btn-play" class="py-2.5 bg-purple-600 hover:bg-purple-500 text-white font-extrabold text-xs rounded-lg active:scale-95 transition-all">
                    ▶️ Play
                </button>
            </div>

            <!-- TOMBOL CC + TERJEMAH -->
            <div class="grid grid-cols-2 gap-2">
                <button onclick="toggleCC()" id="btn-cc" class="py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-extrabold text-xs rounded-lg active:scale-95 transition-all flex items-center justify-center gap-1">
                    💬 CC: OFF
                </button>
                <button onclick="bukaModalKamus()" class="py-2.5 bg-indigo-900/60 hover:bg-indigo-800/80 text-indigo-300 border border-indigo-700/50 font-extrabold text-xs rounded-lg active:scale-95 transition-all flex items-center justify-center gap-1">
                    🌐 Terjemah
                </button>
            </div>

            <!-- TOMBOL SELESAI & SUBMIT -->
            <button id="btn-selesai" onclick="tandaiFilmSelesai()" disabled class="w-full py-2.5 bg-slate-800 text-slate-600 font-black text-xs rounded-lg cursor-not-allowed">
                🔒 Nonton Hingga Akhir
            </button>
            <button id="btn-submit" onclick="submitHasil()" class="hidden w-full py-2.5 bg-pink-600 hover:bg-pink-500 text-white font-black text-xs rounded-lg shadow-lg active:scale-95 transition-all">
                Kirim Laporan Sesi 🎉
            </button>

            <!-- TOMBOL KEMBALI -->
            <button onclick="kembaliKeDaftar()" class="w-full py-2 bg-slate-800 hover:bg-slate-700 text-slate-400 font-bold text-xs rounded-lg transition-all">
                ⬅️ Kembali ke Daftar Sesi
            </button>
        </div>

    </section>

</div>

<!-- MODAL KAMUS & TRANSLATOR -->
<div id="modal-kamus" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 items-center justify-center p-3">
    <div class="w-full max-w-md bg-slate-900 border border-slate-700 rounded-2xl p-4 flex flex-col gap-3 shadow-2xl">
        <div class="flex justify-between items-center border-b border-slate-800 pb-2">
            <span class="text-xs font-black text-purple-400 flex items-center gap-1">
                🌐 Kamus & Terjemahan (English ➔ Indonesia)
            </span>
            <button onclick="tutupModalKamus()" class="text-slate-400 hover:text-white font-bold text-sm">✖</button>
        </div>
        
        <div class="flex flex-col gap-2">
            <textarea id="input-kata" rows="2" class="w-full p-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs font-bold text-slate-200 focus:outline-none focus:border-purple-500 resize-none" placeholder="Ketik kata atau kalimat bahasa Inggris di sini..."></textarea>
            <button onclick="prosesTerjemahkan()" class="w-full py-2.5 bg-purple-600 hover:bg-purple-500 text-white font-black text-xs rounded-xl active:scale-95 transition-all shadow-md">
                Terjemahkan Ke Indonesia 🚀
            </button>
        </div>

        <div id="hasil-kamus" class="hidden p-3 rounded-xl bg-slate-950 border border-slate-800 text-xs flex-col gap-1.5 max-h-48 overflow-y-auto">
            <!-- Hasil terjemahan disuntikkan di sini -->
        </div>
    </div>
</div>

<!-- YOUTUBE API SDK -->
<script src="https://www.youtube.com/iframe_api"></script>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyl7-224Bnau2pPp0FpJBOB2CNOKSr0r9XxQ_fjYwl2KwCDREiTGDys44062D0VFgTP/exec";

    let daftarSesiTersedia = [];
    let completedSesiFromSheets = [];
    let completedMoviesFromSheets = {};
    let sesiAktif = "";
    let playlistSesi = [];
    let indexAktif = 0;
    let filmSelesaiSet = new Set();
    
    let ytPlayerInstance = null;
    let isPlaying = false;
    let checkProgressTimer = null;
    let isVideoEnded = false;
    
    // ==== TIMER REAL (WAKTU NONTON AKTUAL) ====
    let waktuTontonDetik = 0;
    let lastTickTimestamp = 0;
    let timerRealInterval = null;
    
    // ==== CC STATE ====
    let ccAktif = false;

    // ==== STATE PERSISTENCE ====
    const STATE_KEY = "movieQuizCinemaState_v1";
    let isRestoring = false;   // flag agar tidak double call

    // ============ STATE SAVE / LOAD / CLEAR ============
    function simpanState() {
        if (isRestoring) return;   // jangan overwrite saat restore
        try {
            let posisiVideoDetik = 0;
            if (ytPlayerInstance && ytPlayerInstance.getCurrentTime) {
                try { posisiVideoDetik = ytPlayerInstance.getCurrentTime() || 0; } catch(e){}
            } else {
                const dp = document.getElementById('direct-player');
                if (dp) posisiVideoDetik = dp.currentTime || 0;
            }
            const state = {
                sesiAktif: sesiAktif,
                indexAktif: indexAktif,
                filmSelesaiArr: Array.from(filmSelesaiSet),
                playlistSnapshot: playlistSesi,
                ccAktif: ccAktif,
                waktuTontonDetik: waktuTontonDetik,
                posisiVideoDetik: posisiVideoDetik,
                mode: "player",
                timestamp: Date.now()
            };
            localStorage.setItem(STATE_KEY, JSON.stringify(state));
        } catch(e) { console.log("Gagal simpan state:", e); }
    }

    function hapusState() {
        try { localStorage.removeItem(STATE_KEY); } catch(e) {}
    }

    function muatStateTersimpan() {
        try {
            const raw = localStorage.getItem(STATE_KEY);
            if (!raw) return null;
            const state = JSON.parse(raw);
            if (state && state.mode === "player" && state.sesiAktif && Array.isArray(state.playlistSnapshot) && state.playlistSnapshot.length > 0) {
                return state;
            }
            return null;
        } catch(e) { return null; }
    }

    document.addEventListener("DOMContentLoaded", () => {
        pasangProteksiGlobal();
        
        const state = muatStateTersimpan();
        if (state) {
            restorePlayerState(state);
        } else {
            muatDaftarSesi();
        }
    });

    function restorePlayerState(state) {
        isRestoring = true;
        sesiAktif = state.sesiAktif;
        indexAktif = state.indexAktif;
        playlistSesi = state.playlistSnapshot;
        filmSelesaiSet = new Set(state.filmSelesaiArr || []);
        ccAktif = !!state.ccAktif;
        waktuTontonDetik = state.waktuTontonDetik || 0;

        document.getElementById('list-sesi-section').classList.add('hidden');
        document.getElementById('player-section').classList.remove('hidden');
        document.getElementById('player-section').classList.add('grid');
        document.getElementById('label-sesi-aktif').innerText = sesiAktif;

        renderDaftarIkonFilm();
        
        // Muat film lalu restore posisi video + label timer setelah siap
        muatFilm(indexAktif, state.posisiVideoDetik || 0);
        
        setTimeout(() => {
            document.getElementById('label-timer-real').innerText = formatDurasi(waktuTontonDetik);
            isRestoring = false;
        }, 800);
    }

    // ============ PROTEKSI GLOBAL ============
    function pasangProteksiGlobal() {
        document.addEventListener('contextmenu', e => e.preventDefault());

        document.addEventListener('keydown', e => {
            const k = e.key.toLowerCase();
            if (['arrowright','arrowleft','arrowup','arrowdown','j','k','l',',','.','<','>','+','-'].includes(k)) {
                if (e.target.tagName !== 'TEXTAREA' && e.target.tagName !== 'INPUT') {
                    e.preventDefault();
                }
            }
            if ((e.ctrlKey || e.metaKey) && ['arrowright','arrowleft'].includes(k)) {
                e.preventDefault();
            }
        }, { capture: true });
    }

    function pasangProteksiVideo() {
        const container = document.getElementById('video-container');
        if (!container) return;
        container.addEventListener('dblclick', e => { e.preventDefault(); e.stopPropagation(); }, true);
        let lastTouchEnd = 0;
        container.addEventListener('touchend', e => {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) { e.preventDefault(); }
            lastTouchEnd = now;
        }, { passive: false, capture: true });
        container.style.touchAction = 'manipulation';
    }

    // ============ TIMER REAL ============
    function mulaiTimerReal() {
        hentikanTimerReal();
        lastTickTimestamp = Date.now();
        let tickCount = 0;
        timerRealInterval = setInterval(() => {
            let playing = false;
            if (ytPlayerInstance && ytPlayerInstance.getPlayerState) {
                try { playing = ytPlayerInstance.getPlayerState() === YT.PlayerState.PLAYING; } catch(e){}
            } else {
                const dp = document.getElementById('direct-player');
                if (dp) playing = !dp.paused && !dp.ended;
            }
            const now = Date.now();
            if (playing) {
                const delta = Math.floor((now - lastTickTimestamp) / 1000);
                if (delta > 0) {
                    waktuTontonDetik += delta;
                }
            }
            lastTickTimestamp = now;
            document.getElementById('label-timer-real').innerText = formatDurasi(waktuTontonDetik);
            
            // Auto-save state tiap 10 detik
            tickCount++;
            if (tickCount % 10 === 0 && !isRestoring) {
                simpanState();
            }
        }, 1000);
    }

    function hentikanTimerReal() {
        if (timerRealInterval) { clearInterval(timerRealInterval); timerRealInterval = null; }
    }

    function resetTimerReal() {
        hentikanTimerReal();
        waktuTontonDetik = 0;
        lastTickTimestamp = 0;
        document.getElementById('label-timer-real').innerText = "00:00";
    }

    // ============ LOAD SESI ============
    async function muatDaftarSesi() {
        const loadingEl = document.getElementById('loading-sesi');
        const containerEl = document.getElementById('container-sesi-list');
        loadingEl.classList.remove('hidden');
        containerEl.classList.add('hidden');

        try {
            const res = await fetch(`${WEB_APP_URL}?action=getSessions`);
            const responseData = await res.json();

            if (responseData && typeof responseData === 'object') {
                if (Array.isArray(responseData.sessions)) daftarSesiTersedia = responseData.sessions;
                if (Array.isArray(responseData.completedSessions)) completedSesiFromSheets = responseData.completedSessions;
                if (responseData.completedMoviesBySession) completedMoviesFromSheets = responseData.completedMoviesBySession;
            }
        } catch (e) {
            console.log("Gagal memuat sesi.");
        }

        loadingEl.classList.add('hidden');
        containerEl.innerHTML = '';
        containerEl.classList.remove('hidden');

        daftarSesiTersedia.forEach((sesi, idx) => {
            const isDone = completedSesiFromSheets.includes(sesi);
            const card = document.createElement('div');
            card.className = `p-3 rounded-xl bg-slate-950 border ${isDone ? 'border-emerald-500/50' : 'border-slate-800'} flex items-center justify-between shadow cursor-pointer hover:border-purple-500 transition-all`;
            card.onclick = () => pilihSesi(sesi);

            card.innerHTML = `
                <div class="flex items-center gap-2.5">
                    <div class="w-7 h-7 rounded-lg ${isDone ? 'bg-emerald-500 text-white' : 'bg-slate-800 text-purple-400'} flex items-center justify-center font-black text-xs">
                        ${isDone ? '✓' : (idx + 1)}
                    </div>
                    <div>
                        <div class="font-extrabold text-xs text-slate-200">${sesi}</div>
                        <div class="text-[9px] font-bold ${isDone ? 'text-emerald-400' : 'text-slate-500'}">
                            ${isDone ? 'Selesai Dikembangkan ✅' : 'Siap Diputar 🎬'}
                        </div>
                    </div>
                </div>
            `;
            containerEl.appendChild(card);
        });
    }

    async function pilihSesi(sesi) {
        sesiAktif = sesi;
        try {
            const res = await fetch(`${WEB_APP_URL}?sesi=${encodeURIComponent(sesi)}`);
            const data = await res.json();

            if (!Array.isArray(data) || data.length === 0) {
                alert(`Data film untuk "${sesi}" tidak ditemukan.`);
                return;
            }

            playlistSesi = data;
            indexAktif = 0;
            
            const arrayIndices = completedMoviesFromSheets[sesi] || [];
            filmSelesaiSet = new Set(arrayIndices);

            document.getElementById('list-sesi-section').classList.add('hidden');
            document.getElementById('player-section').classList.remove('hidden');
            document.getElementById('player-section').classList.add('grid');
            document.getElementById('label-sesi-aktif').innerText = sesi;
            
            renderDaftarIkonFilm();
            muatFilm(0, 0);
            simpanState();
        } catch (e) {
            alert("Gagal terhubung ke server.");
        }
    }

    function renderDaftarIkonFilm() {
        const container = document.getElementById('container-film-list');
        container.innerHTML = '';

        playlistSesi.forEach((item, idx) => {
            const isCurrent = idx === indexAktif;
            const isDone = filmSelesaiSet.has(idx);

            const btn = document.createElement('button');
            btn.onclick = () => gantiFilm(idx);
            btn.className = `p-2 rounded-lg text-left border text-[11px] font-bold flex justify-between items-center transition-all ${
                isCurrent ? 'bg-purple-600 text-white border-purple-500' : isDone ? 'bg-emerald-950/60 text-emerald-300 border-emerald-800' : 'bg-slate-900 text-slate-300 border-slate-800'
            }`;

            btn.innerHTML = `
                <span class="truncate max-w-[110px]">${idx + 1}. ${item.judul || 'Film'}</span>
                <span>${isDone ? '✅' : isCurrent ? '▶' : '🔒'}</span>
            `;
            container.appendChild(btn);
        });

        document.getElementById('label-progres-total').innerText = `${filmSelesaiSet.size}/${playlistSesi.length} Film`;

        if (filmSelesaiSet.size === playlistSesi.length && playlistSesi.length > 0) {
            document.getElementById('btn-selesai').classList.add('hidden');
            document.getElementById('btn-submit').classList.remove('hidden');
        } else {
            document.getElementById('btn-selesai').classList.remove('hidden');
            document.getElementById('btn-submit').classList.add('hidden');
        }
    }

    function gantiFilm(idx) {
        if (indexAktif === idx) return;
        indexAktif = idx;
        renderDaftarIkonFilm();
        muatFilm(idx, 0);
        simpanState();
    }

    // ============ LOAD FILM (dengan parameter startAt) ============
    function muatFilm(idx, startAt = 0) {
        resetTimer();
        resetTimerReal();
        isPlaying = false;
        ccAktif = ccAktif;   // tetap sesuai state
        perbaruiLabelCC();
        
        // Reset instance & label agar tidak nyangkut durasi lama
        ytPlayerInstance = null;
        document.getElementById('label-waktu').innerText = "⏳ 00:00";

        document.getElementById('btn-play').innerText = "▶️ Play";

        const item = playlistSesi[idx];
        document.getElementById('judul-film-aktif').innerText = item.judul || `Film #${item.noFilm}`;
        
        const container = document.getElementById('video-container');
        container.innerHTML = '';
        
        if (filmSelesaiSet.has(idx)) {
            bukaTombolSelesai();
        } else {
            kunciTombolSelesai();
        }

        const url = item.url || '';

        if (url.includes('youtube.com') || url.includes('youtu.be')) {
            let videoId = url.includes('v=') ? url.split('v=')[1].split('&')[0] : url.split('/').pop().split('?')[0];
            const ytDiv = document.createElement('div');
            ytDiv.id = 'yt-embed-player';
            ytDiv.className = 'w-full h-full';
            container.appendChild(ytDiv);

            ytPlayerInstance = new YT.Player('yt-embed-player', {
                videoId: videoId,
                playerVars: { 
                    'controls': 0, 
                    'rel': 0, 
                    'disablekb': 1, 
                    'modestbranding': 1, 
                    'playsinline': 1,
                    'cc_load_policy': 0,
                    'iv_load_policy': 3,
                    'start': Math.floor(startAt)
                },
                events: { 
                    'onStateChange': onYouTubeStateChange,
                    'onReady': (e) => onYouTubeReady(e, startAt)
                }
            });
        } else {
            ytPlayerInstance = null;
            const vPlayer = document.createElement('video');
            vPlayer.id = 'direct-player';
            vPlayer.className = 'w-full h-full object-contain';
            vPlayer.src = url;
            vPlayer.playsInline = true;
            vPlayer.controls = false;
            vPlayer.disablePictureInPicture = true;
            vPlayer.addEventListener('ratechange', () => {
                if (vPlayer.playbackRate !== 1) vPlayer.playbackRate = 1;
            });
            vPlayer.onplay = () => { isPlaying = true; document.getElementById('btn-play').innerText = "⏸️ Pause"; };
            vPlayer.onpause = () => { isPlaying = false; document.getElementById('btn-play').innerText = "▶️ Play"; };
            vPlayer.onended = function() { isPlaying = false; document.getElementById('btn-play').innerText = "▶️ Play"; bukaTombolSelesai(); };
            
            // Mulai timer SETELAH metadata siap
            vPlayer.onloadedmetadata = () => {
                if (startAt > 2 && startAt < vPlayer.duration) {
                    try { vPlayer.currentTime = startAt; } catch(e){}
                }
                if (vPlayer.duration > 0) {
                    document.getElementById('label-waktu').innerText = `⏳ 00:00 / ${formatDurasi(vPlayer.duration)}`;
                }
                resetTimer();
                checkProgressTimer = setInterval(pantauProgresWaktu, 500);
            };
            
            container.appendChild(vPlayer);
        }

        setTimeout(pasangProteksiVideo, 100);
        mulaiTimerReal();
    }

    // ============ YOUTUBE READY (dengan startAt) ============
    function onYouTubeReady(event, startAt = 0) {
        try { event.target.setPlaybackRate(1); } catch(e){}
        try { event.target.unloadModule('captions'); event.target.loadModule('captions'); } catch(e){}
        
        // Seek ke posisi terakhir jika ada
        if (startAt > 2) {
            try { event.target.seekTo(startAt, true); } catch(e){}
        }
        
        // Tunggu duration tersedia baru start timer
        resetTimer();
        let cekDuration = setInterval(() => {
            try {
                const dur = event.target.getDuration();
                if (dur > 0) {
                    clearInterval(cekDuration);
                    document.getElementById('label-waktu').innerText = `⏳ 00:00 / ${formatDurasi(dur)}`;
                    checkProgressTimer = setInterval(pantauProgresWaktu, 500);
                }
            } catch(e) { clearInterval(cekDuration); }
        }, 200);
        setTimeout(() => clearInterval(cekDuration), 10000);
    }

    function onYouTubeStateChange(event) {
        const btnPlay = document.getElementById('btn-play');
        if (event.data === YT.PlayerState.PLAYING) {
            isPlaying = true;
            btnPlay.innerText = "⏸️ Pause";
            try { ytPlayerInstance.setPlaybackRate(1); } catch(e){}
        } else if (event.data === YT.PlayerState.PAUSED) {
            isPlaying = false;
            btnPlay.innerText = "▶️ Play";
        } else if (event.data === YT.PlayerState.ENDED) {
            isPlaying = false;
            btnPlay.innerText = "▶️ Play";
            bukaTombolSelesai();
        }
    }

    // ============ PANTAU PROGRES ============
    function pantauProgresWaktu() {
        if (isVideoEnded) return;

        let currentTime = 0, duration = 0;
        if (ytPlayerInstance && ytPlayerInstance.getCurrentTime) {
            try {
                currentTime = ytPlayerInstance.getCurrentTime() || 0;
                duration = ytPlayerInstance.getDuration() || 0;
            } catch(e){}
        } else {
            const directPlayer = document.getElementById('direct-player');
            if (directPlayer) {
                currentTime = directPlayer.currentTime || 0;
                duration = directPlayer.duration || 0;
            }
        }

        if (duration > 0) {
            const formatTime = (s) => new Date(s * 1000).toISOString().substr(14, 5);
            document.getElementById('label-waktu').innerText = `⏳ ${formatTime(currentTime)} / ${formatTime(duration)}`;
            if (duration - currentTime <= 1.5) {
                bukaTombolSelesai();
            }
        } else {
            document.getElementById('label-waktu').innerText = `⏳ 00:00 / 00:00`;
        }
    }

    function bukaTombolSelesai() {
        isVideoEnded = true;
        const btnSelesai = document.getElementById('btn-selesai');
        btnSelesai.disabled = false;
        btnSelesai.className = "w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-black text-xs rounded-lg active:scale-95 transition-all cursor-pointer";
        btnSelesai.innerHTML = "Selesai Nonton Film Ini ✅";
    }

    function kunciTombolSelesai() {
        isVideoEnded = false;
        const btnSelesai = document.getElementById('btn-selesai');
        btnSelesai.disabled = true;
        btnSelesai.className = "w-full py-2.5 bg-slate-800 text-slate-600 font-black text-xs rounded-lg cursor-not-allowed";
        btnSelesai.innerHTML = "🔒 Nonton Hingga Akhir";
    }

    function togglePlay() {
        if (ytPlayerInstance && ytPlayerInstance.playVideo) {
            if (isPlaying) { 
                ytPlayerInstance.pauseVideo(); 
            } else { 
                ytPlayerInstance.playVideo(); 
            }
        } else {
            const directPlayer = document.getElementById('direct-player');
            if (directPlayer) {
                if (isPlaying) { 
                    directPlayer.pause(); 
                } else { 
                    directPlayer.play(); 
                }
            }
        }
    }

    function rewindVideo(seconds) {
        if (ytPlayerInstance && ytPlayerInstance.getCurrentTime) {
            ytPlayerInstance.seekTo(Math.max(0, ytPlayerInstance.getCurrentTime() - seconds), true);
        } else {
            const directPlayer = document.getElementById('direct-player');
            if (directPlayer) directPlayer.currentTime = Math.max(0, directPlayer.currentTime - seconds);
        }
    }

    // ============ TOGGLE CC ============
    function toggleCC() {
        ccAktif = !ccAktif;
        perbaruiLabelCC();
        simpanState();

        if (ytPlayerInstance && ytPlayerInstance.getOptions) {
            try {
                if (ccAktif) {
                    ytPlayerInstance.loadModule('captions');
                    ytPlayerInstance.setOption('captions', 'track', {});
                    ytPlayerInstance.setOption('captions', 'reload', true);
                } else {
                    ytPlayerInstance.unloadModule('captions');
                }
            } catch(e) { console.log('CC YT error:', e); }
        }

        const dp = document.getElementById('direct-player');
        if (dp) {
            const tracks = dp.textTracks;
            for (let i = 0; i < tracks.length; i++) {
                tracks[i].mode = ccAktif ? 'showing' : 'hidden';
            }
        }
    }

    function perbaruiLabelCC() {
        const btn = document.getElementById('btn-cc');
        btn.innerText = ccAktif ? "💬 CC: ON" : "💬 CC: OFF";
        btn.className = ccAktif
            ? "py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-xs rounded-lg active:scale-95 transition-all flex items-center justify-center gap-1"
            : "py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-extrabold text-xs rounded-lg active:scale-95 transition-all flex items-center justify-center gap-1";
    }

    // ============ FORMAT DURASI ============
    function formatDurasi(totalDetik) {
        if (!totalDetik || totalDetik <= 0) return "00:00";
        const jam = Math.floor(totalDetik / 3600);
        const menit = Math.floor((totalDetik % 3600) / 60);
        const detik = totalDetik % 60;
        const pad = (n) => String(n).padStart(2, '0');
        return jam > 0
            ? `${pad(jam)}:${pad(menit)}:${pad(detik)}`
            : `${pad(menit)}:${pad(detik)}`;
    }

    // ============ SUBMIT FILM ============
    async function tandaiFilmSelesai() {
        if (!isVideoEnded) return;
        
        filmSelesaiSet.add(indexAktif);
        renderDaftarIkonFilm();
        simpanState();

        const currentMovie = playlistSesi[indexAktif];
        const waktuTontonFinal = waktuTontonDetik;
        try {
            await fetch(WEB_APP_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ 
                    namaSiswa: "Siswa", 
                    sesi: sesiAktif, 
                    totalFilm: playlistSesi.length,
                    status: "Selesai Film",
                    filmIndex: indexAktif,
                    judulFilm: currentMovie ? currentMovie.judul : "",
                    durasiDetik: waktuTontonFinal,
                    durasiFormat: formatDurasi(waktuTontonFinal)
                })
            });
        } catch (e) {
            console.log("Gagal mencatat progres film.");
        }

        if (filmSelesaiSet.size === playlistSesi.length) {
            document.getElementById('btn-selesai').classList.add('hidden');
            document.getElementById('btn-submit').classList.remove('hidden');
            alert("Seluruh film di sesi ini selesai! Klik Kirim Laporan Sesi.");
        } else {
            alert(`Film ${indexAktif + 1} selesai!\n⏱️ Waktu nonton tercatat: ${formatDurasi(waktuTontonFinal)}\n\nSilakan pilih film berikutnya.`);
        }
    }

    async function submitHasil() {
        const btnSubmit = document.getElementById('btn-submit');
        btnSubmit.innerText = "Mengirim...";
        btnSubmit.disabled = true;

        try {
            await fetch(WEB_APP_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ 
                    namaSiswa: "Siswa", 
                    sesi: sesiAktif, 
                    totalFilm: playlistSesi.length,
                    status: "Selesai Sesi"
                })
            });
            
            alert("Laporan sesi berhasil dikirim!");
            hapusState();
            kembaliKeDaftar();
        } catch (e) {
            alert("Gagal mengirim laporan.");
            btnSubmit.innerText = "Kirim Laporan Sesi 🎉";
            btnSubmit.disabled = false;
        }
    }

    // ============ KAMUS ============
    function bukaModalKamus() {
        const modal = document.getElementById('modal-kamus');
        modal.classList.remove('hidden');
        modal.classList.add('flex');
    }

    function tutupModalKamus() {
        const modal = document.getElementById('modal-kamus');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
    }

    async function prosesTerjemahkan() {
        const textInput = document.getElementById('input-kata').value.trim();
        const elHasil = document.getElementById('hasil-kamus');
        if (!textInput) return;

        elHasil.classList.remove('hidden');
        elHasil.classList.add('flex');
        elHasil.innerHTML = `<span class="text-slate-400 animate-pulse">Sedang menerjemahkan...</span>`;

        try {
            const translateUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=id&dt=t&q=${encodeURIComponent(textInput)}`;
            const res = await fetch(translateUrl);
            const data = await res.json();
            
            let translatedText = '';
            if (data && data[0]) {
                data[0].forEach(item => {
                    if (item[0]) translatedText += item[0];
                });
            }

            if (translatedText) {
                elHasil.innerHTML = `
                    <div class="font-extrabold text-[11px] text-slate-400 uppercase">Bahasa Inggris:</div>
                    <div class="text-xs font-bold text-purple-300 italic">"${textInput}"</div>
                    <div class="border-t border-slate-800 my-1"></div>
                    <div class="font-extrabold text-[11px] text-emerald-400 uppercase">Arti Bahasa Indonesia:</div>
                    <div class="text-xs font-extrabold text-emerald-200 leading-relaxed">${translatedText}</div>
                `;
            } else {
                throw new Error();
            }
        } catch (e) {
            elHasil.innerHTML = `<span class="text-rose-400 font-bold">Gagal menerjemahkan. Pastikan terhubung ke internet.</span>`;
        }
    }

    // ============ RESET & NAVIGASI ============
    function resetTimer() {
        if (checkProgressTimer) { clearInterval(checkProgressTimer); checkProgressTimer = null; }
    }

    function kembaliKeDaftar() {
        resetTimer();
        hentikanTimerReal();
        hapusState();
        document.getElementById('player-section').classList.add('hidden');
        document.getElementById('player-section').classList.remove('grid');
        document.getElementById('list-sesi-section').classList.remove('hidden');
        document.getElementById('btn-submit').classList.add('hidden');
        document.getElementById('video-container').innerHTML = '';
        muatDaftarSesi();
    }

    // Simpan state saat user meninggalkan halaman / refresh
    window.addEventListener('beforeunload', () => {
        if (!isRestoring && sesiAktif && playlistSesi.length > 0) {
            simpanState();
        }
    });
</script>
